<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1155 1000" width="100%" height="100%">
  <defs>
    
    <radialGradient id="glowLeft" cx="10%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="95%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#1abc9c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0" />
    </radialGradient>
    
   
    <linearGradient id="uiCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a252f" stop-opacity="0.8" />
    </linearGradient>

    
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

 
  <rect width="1155" height="1000" fill="#14181d" />
  
  
  <rect width="1155" height="1000" fill="url(#glowLeft)" />
  <rect width="1155" height="1000" fill="url(#glowRight)" />

  
  <g opacity="0.4">
    <rect x="200" y="150" width="500" height="700" rx="15" fill="url(#uiCardBg)" stroke="#ffffff" stroke-opacity="0.05" />
    <rect x="240" y="220" width="60" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="310" y="220" width="150" height="8" rx="4" fill="#ffffff" opacity="0.1" />
    <rect x="240" y="250" width="80" height="8" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="330" y="250" width="100" height="8" rx="4" fill="#ffffff" opacity="0.1" />
    <rect x="240" y="310" width="120" height="8" rx="4" fill="#1abc9c" opacity="0.6" />
    <rect x="370" y="310" width="50" height="8" rx="4" fill="#ffffff" opacity="0.1" />
    <rect x="240" y="370" width="200" height="8" rx="4" fill="#e67e22" opacity="0.5" />
    <rect x="260" y="400" width="150" height="8" rx="4" fill="#ffffff" opacity="0.2" />
    <rect x="260" y="430" width="100" height="8" rx="4" fill="#ffffff" opacity="0.1" />
    <rect x="240" y="650" width="40" height="6" rx="3" fill="#1abc9c" opacity="0.8" />
    <rect x="240" y="680" width="80" height="6" rx="3" fill="#ffffff" opacity="0.2" />
    <rect x="240" y="710" width="60" height="6" rx="3" fill="#1abc9c" opacity="0.8" />
    <rect x="240" y="740" width="100" height="6" rx="3" fill="#ffffff" opacity="0.2" />
  </g>

  
  <g transform="translate(650, 100)">
    <rect width="180" height="70" rx="12" fill="url(#uiCardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="15" y="15" width="30" height="30" rx="8" fill="#e67e22" opacity="0.8" />
    <rect x="60" y="20" width="80" height="8" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="60" y="35" width="50" height="8" rx="4" fill="#ffffff" opacity="0.2" />
  </g>

  
  <g transform="translate(760, 720)">
    <rect width="280" height="80" rx="15" fill="url(#uiCardBg)" stroke="#ffffff" stroke-opacity="0.05" />
    <rect x="20" y="30" width="150" height="10" rx="5" fill="#1abc9c" opacity="0.9" />
    <rect x="20" y="50" width="200" height="10" rx="5" fill="#ffffff" opacity="0.1" />
  </g>

  
  <g transform="translate(90, 720)">
    <rect width="220" height="160" rx="12" fill="url(#uiCardBg)" stroke="#ffffff" stroke-opacity="0.1" />
    <rect x="15" y="20" width="40" height="6" rx="3" fill="#e67e22" opacity="0.8" />
    <rect x="15" y="50" width="120" height="8" rx="4" fill="#1abc9c" opacity="0.7" />
    <rect x="15" y="70" width="90" height="8" rx="4" fill="#ffffff" opacity="0.2" />
    <rect x="15" y="100" width="140" height="8" rx="4" fill="#1abc9c" opacity="0.7" />
    <rect x="15" y="120" width="60" height="8" rx="4" fill="#ffffff" opacity="0.2" />
  </g>

 
  <g transform="translate(950, 100)">
    <polygon points="0,0 200,100 100,180 -100,80" fill="none" stroke="#1abc9c" stroke-width="3" opacity="0.6" />
    <polygon points="0,40 200,140 100,220 -100,120" fill="none" stroke="#1abc9c" stroke-width="3" opacity="0.4" />
    <polygon points="0,80 200,180 100,260 -100,160" fill="none" stroke="#1abc9c" stroke-width="3" opacity="0.2" />
  </g>

 
  <g transform="translate(920, 600)">
    <polygon points="0,0 180,90 90,160 -90,70" fill="none" stroke="#e67e22" stroke-width="3" opacity="0.7" />
    <polygon points="0,30 180,120 90,190 -90,100" fill="none" stroke="#e67e22" stroke-width="3" opacity="0.5" />
    <polygon points="0,60 180,150 90,220 -90,130" fill="none" stroke="#e67e22" stroke-width="3" opacity="0.3" />
  </g>

 
  <text x="52%" y="50%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="105" 
        fill="#ffffff" filter="url(#textShadow)">
    Stack UnOverflow
